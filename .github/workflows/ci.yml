# LedgerFlow CI
#
# Design note: the `instrumented` job is where BUG4 (backup/restore) and BUG8
# (schema migration) are actually caught. If it becomes flaky, FIX THE FLAKE.
# Do not add `continue-on-error` — that turns the durability guarantees in
# SPEC.md §7 into decoration.
#
# Pin action versions when you first run this; the majors below are a starting
# point, not a guarantee.

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false
  JAVA_VERSION: '17'

jobs:
  # ══════════════════════════════════════════════════════════════════════
  # Cheap, fast failures first. No Gradle, no JDK — pure git hygiene.
  # ══════════════════════════════════════════════════════════════════════
  guards:
    name: guards (secrets, case, schema, versionCode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need full history for tag + diff comparisons

      - name: Fail if signing material was committed
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(keystore\.properties|local\.properties|\.jks$|\.keystore$|google-services\.json)'; then
            echo "::error::Signing/secret material is tracked in git. Remove it and rotate."
            exit 1
          fi
          echo "OK: no secret material tracked."

      - name: Fail on case-only filename collisions
        # Windows is case-insensitive; Linux CI is not. Two files differing only
        # by case resolve fine locally and explode on the runner.
        run: |
          set -euo pipefail
          DUPES=$(git ls-files | tr 'A-Z' 'a-z' | sort | uniq -d || true)
          if [ -n "$DUPES" ]; then
            echo "::error::Case-only filename collisions (breaks Linux CI):"
            echo "$DUPES"
            exit 1
          fi
          echo "OK: no case collisions."

      - name: Fail on CRLF in source
        run: |
          set -euo pipefail
          if git grep -Il $'\r$' -- '*.kt' '*.kts' '*.xml' '*.yml' >/dev/null 2>&1; then
            echo "::error::CRLF line endings in source. Check .gitattributes and core.autocrlf."
            git grep -Il $'\r$' -- '*.kt' '*.kts' '*.xml' '*.yml'
            exit 1
          fi
          echo "OK: LF endings."

      - name: Room schema immutability guard (BUG8)
        run: bash scripts/guard-schema.sh

      - name: versionCode monotonicity guard (BUG3)
        run: bash scripts/guard-version.sh

      # Ground truth for a receipt is committed before the extractor that reads
      # it. Bootstrapping a fixture from the extractor's own output is fast,
      # undetectable afterwards, and makes the corpus measure the extractor
      # against its own opinions. SPEC.md §12.
      - name: OCR corpus-order guard
        run: bash scripts/guard-corpus-order.sh

      # Every workflow parses (BUG32). It cannot catch THIS file breaking --
      # a ci.yml GitHub cannot load runs nothing, this step included, which is
      # why it is also a pre-push guard in CLAUDE.md §11. Here it catches the
      # other workflows (release.yml) before a tag finds out.
      - name: Workflow parse guard (BUG32)
        run: bash scripts/guard-workflows.sh

  # ══════════════════════════════════════════════════════════════════════
  static-analysis:
    name: static analysis
    runs-on: ubuntu-latest
    needs: guards
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4

      - name: Banned-API check
        # These map 1:1 to the Seven Laws in CLAUDE.md §2.
        run: |
          set -euo pipefail
          FAIL=0
          # check <message> <pattern> <pathspec>...
          #
          # The message comes FIRST so that an arbitrary number of pathspecs can
          # follow. The previous signature was (pattern, glob, message), which
          # silently dropped every pathspec after the second: the cacheDir check
          # passed four arguments, so ':!*test*' was never applied as an
          # exclusion and was printed as the error message instead.
          #
          # Pathspecs are quoted ("$@") — unquoted $2 was subject to word
          # splitting and globbing by the runner's shell before git ever saw it.
          #
          # Patterns use POSIX character classes ([[:space:]]), not PCRE \s,
          # because `git grep -E` is POSIX ERE and does not portably honour \s.
          check() {
            local msg="$1"; shift
            local pattern="$1"; shift
            if git grep -nI -E "$pattern" -- "$@" >/dev/null 2>&1; then
              echo "::error::$msg"
              git grep -nI -E "$pattern" -- "$@"
              FAIL=1
            fi
          }
          # Docs, workflows and guard scripts are excluded from the identifier
          # bans: they must be able to NAME a banned API in order to ban it.
          # Matching the call form `…(` keeps prose and comments clean too.
          # The root build.gradle.kts is excluded from the cacheDir ban for the
          # same reason: it defines the local `bannedApiCheck`, whose regex is
          # the literal `\.cacheDir\b`. Unexcluded, that definition was the only
          # match in the repository and failed this step on every run (BUG33).
          # Only the ROOT file, by exact path: a module's build script that
          # touched cacheDir would still be caught.
          check 'Destructive migration is banned outside dev source sets (Law 4).' \
                'fallbackToDestructiveMigration[A-Za-z]*[[:space:]]*\(' \
                ':!*/dev/*' ':!.github/*' ':!scripts/*' ':!docs/*' ':!*.md'
          check 'cacheDir is OS-clearable. Persistent data belongs in filesDir (Law 5, BUG2).' \
                '\.cacheDir' \
                ':!*imageloading*' ':!*test*' ':!*Test*' \
                ':!.github/*' ':!scripts/*' ':!docs/*' ':!*.md' ':(top,exclude)build.gradle.kts'
          check 'Money must be Long minor units (Law 3).' \
                '(Float|Double)[[:space:]]*(=|\)|,).*(amount|price|total|balance)' \
                'core/model'
          # `!!` is a build error outside tests (CLAUDE.md §5, BUG7). Enforced
          # by grep rather than by detekt: detekt's UnsafeCallOnNullableType
          # needs type resolution, and detekt 1.23.8 only creates its
          # type-resolving Android tasks when the Kotlin Android plugin is
          # applied -- which AGP 9 forbids. Mirrors the `bannedApiCheck` Gradle
          # task so local and CI failures match.
          check 'Non-null assertion `!!` is banned outside tests (Law 7, BUG7). Use requireNotNull(x) { "why" }.' \
                '[[:alnum:]_)\]]!!' \
                '*.kt' ':!*/test/*' ':!*/androidTest/*' ':!*Test.kt'
          # Law 6 as amended by ADR-0021. The RELEASE APK does declare INTERNET
          # -- bundled ML Kit merges it from Google's telemetry uploader, and that
          # one is pinned in :app's EXPECTED_MERGED_PERMISSIONS. What must never
          # happen is US declaring it in a source manifest, which would mean our
          # own code wanting the network. Law 6's substantive half is unchanged:
          # nothing this app computes touches one.
          check 'We must not declare INTERNET ourselves (Law 6, ADR-0021). ML Kit merges one; that is pinned in EXPECTED_MERGED_PERMISSIONS.' \
                '<uses-permission[^>]*android\.permission\.INTERNET' \
                '*AndroidManifest.xml'
          # D-04: RECEIVE_SMS/READ_SMS are Play-restricted and live in exactly
          # one flavour's source set. Merged into src/main they would reach
          # playSafe too, and the Play-eligible build would stop being
          # submittable -- with no build failure and no on-device symptom to
          # catch it. The pathspec excludes every src/smsFull/ manifest, so what
          # is left is by definition the wrong place. Mirrors the
          # `restrictedPermissionCheck` Gradle task.
          check 'RECEIVE_SMS/READ_SMS belong to the smsFull source set only (D-04, SPEC.md §3.1).' \
                '<uses-permission[^>]*android\.permission\.(RECEIVE|READ)_SMS' \
                '*AndroidManifest.xml' ':!*/src/smsFull/*'
          exit $FAIL

      # The greps above are a BLOCKLIST of names we already know about. The
      # Gradle guards are the ALLOWLIST -- "any permission not pinned fails" --
      # and until P4 they ran only on a developer's machine, so a PR that merged
      # a brand-new permission passed CI with nothing to say about it. That is
      # the property Law 6 now depends on, since ADR-0021 replaced its grep with
      # a pinned merged manifest, so it has to run where merges are gated.
      - name: Permission pins (allowlist -- Gradle, source and merged manifests)
        run: |
          ./gradlew restrictedPermissionCheck bannedApiCheck \
            :app:mergedPermissionCheckSmsFullDebug \
            :app:mergedPermissionCheckSmsFullRelease \
            :app:mergedPermissionCheckPlaySafeDebug \
            :app:mergedPermissionCheckPlaySafeRelease \
            --stacktrace

      # UNQUALIFIED task names, and that is load-bearing: `lintSmsFullDebug`
      # with no `:module:` prefix runs in every project that has the task, so
      # this job has always covered all 22 Android modules. Do NOT "tidy" it
      # into `:app:lintSmsFullDebug` -- `:app` holds no business logic by
      # design (CLAUDE.md §3), so it is the module with the least to check.
      #
      # `preMergeCheck` was the half that WAS narrowed to `:app`, which is the
      # worse direction to get wrong: it is the task CLAUDE.md §12 tells you to
      # run before declaring a change done, so eight real lint errors across
      # five library modules passed every local gate and were waiting to fail
      # here on the first push (S13 §6). Fixed in the root build file; both
      # halves now say the same thing, which is the whole point of that task.
      - run: ./gradlew detekt lintSmsFullDebug lintPlaySafeDebug --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: lint-reports, path: '**/build/reports/**' }

  # ══════════════════════════════════════════════════════════════════════
  unit-test:
    name: unit tests (${{ matrix.flavour }})
    runs-on: ubuntu-latest
    needs: guards
    strategy:
      fail-fast: false
      matrix:
        flavour: [SmsFull, PlaySafe]   # BOTH flavours ship. Both get tested.
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew test${{ matrix.flavour }}DebugUnitTest --stacktrace

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unit-test-results-${{ matrix.flavour }}
          path: '**/build/reports/tests/**'

  # ══════════════════════════════════════════════════════════════════════
  # BUG5 — UI overlap/misalignment. JVM-only, no emulator, fast.
  # ══════════════════════════════════════════════════════════════════════
  screenshot:
    name: screenshot diffs (BUG5)
    runs-on: ubuntu-latest
    needs: guards
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew verifyRoborazziSmsFullDebug --stacktrace

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshot-diffs
          path: '**/build/outputs/roborazzi/**'

  # ══════════════════════════════════════════════════════════════════════
  # THE JOB THAT MATTERS. Migration chain + backup round-trip + draft
  # survival. Never make this non-blocking.
  # ══════════════════════════════════════════════════════════════════════
  instrumented:
    name: instrumented (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    needs: [static-analysis, unit-test]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]   # minSdk floor and current target. Nightly adds 34.
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api }}

      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.api >= 30 && 'google_apis' || 'default' }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            ./gradlew :core:database:connectedSmsFullDebugAndroidTest --stacktrace
            ./gradlew :core:crypto:connectedSmsFullDebugAndroidTest   --stacktrace
            ./gradlew :feature:ingest:connectedSmsFullDebugAndroidTest --stacktrace
            ./gradlew connectedSmsFullDebugAndroidTest --stacktrace

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: instrumented-reports-api${{ matrix.api }}
          path: '**/build/reports/androidTests/**'

  # ══════════════════════════════════════════════════════════════════════
  compose-stability:
    name: compose stability report
    runs-on: ubuntu-latest
    needs: guards
    continue-on-error: true   # advisory: informs review, doesn't block
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleSmsFullRelease -Pledgerflow.enableComposeCompilerReports=true
      - uses: actions/upload-artifact@v4
        with: { name: compose-reports, path: '**/build/compose_compiler/**' }

  # ══════════════════════════════════════════════════════════════════════
  assemble:
    name: assemble + size budget
    runs-on: ubuntu-latest
    needs: [static-analysis, unit-test]
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew assembleSmsFullDebug assemblePlaySafeDebug --stacktrace

      # SPEC.md §11's budget is written for an "arm64 release split", so that is
      # what has to be built to measure it: R8 + resource shrinking on, one ABI.
      # -Pledgerflow.abiSplits turns the splits block on (see
      # AndroidConventions.kt); without it no split artefact exists at all.
      - run: ./gradlew assembleSmsFullRelease assemblePlaySafeRelease -Pledgerflow.abiSplits --stacktrace

      - name: APK size budget (SPEC.md §11 — arm64 release split)
        run: |
          set -euo pipefail
          # 50 MiB since ADR-0024: OpenCV's native library measured the arm64
          # release split at 42.94 MiB (18.18 before). Moved on that
          # measurement, with ~7 MiB of headroom -- not a round number chosen
          # to make a failure go away.
          LIMIT=$((50 * 1024 * 1024))

          # Anchored on `release`, on the arm64 split's own filename, and rooted
          # at app/ -- all three matter. The previous glob was
          # '*/outputs/apk/*/debug/*.apk' passed to `find -path`, whose `*`
          # crosses '/': it therefore also matched :benchmark's 39 MB APK and
          # every androidTest APK, and it measured a *universal debug* build
          # against a budget for an arm64 *release* split. It failed at 22.77 MB
          # on this repository's first CI run for a reason that said nothing
          # about the app -- the same commit's arm64 release split is 4.82 MB.
          # SPEC.md §16 Q18.
          mapfile -t APKS < <(find app/build/outputs/apk -type f -name '*arm64-v8a-release*.apk' | sort)

          # An empty list must fail. A size gate that measures nothing passes,
          # and this repository has recorded four guards that could not see the
          # thing they checked.
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::No arm64 release split found. Did -Pledgerflow.abiSplits get dropped?"
            exit 1
          fi

          FAIL=0
          for f in "${APKS[@]}"; do
            SIZE=$(stat -c%s "$f")
            printf '%s -> %s KiB\n' "$f" "$((SIZE / 1024))"
            if [ "$SIZE" -gt "$LIMIT" ]; then
              echo "::error::$f exceeds the 50 MB budget (SPEC.md §11, ADR-0024)."
              FAIL=1
            fi
          done
          exit $FAIL

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: '**/outputs/apk/**/*.apk'
          retention-days: 14

  # ══════════════════════════════════════════════════════════════════════
  # Single required status check for branch protection.
  # ══════════════════════════════════════════════════════════════════════
  pr-gate:
    name: pr-gate
    runs-on: ubuntu-latest
    needs: [guards, static-analysis, unit-test, screenshot, instrumented, assemble]
    if: always()
    steps:
      - name: Verify all gates passed
        run: |
          if echo '${{ join(needs.*.result, ' ') }}' | grep -qE 'failure|cancelled'; then
            echo "::error::One or more required gates failed."
            exit 1
          fi
          echo "All gates green."
