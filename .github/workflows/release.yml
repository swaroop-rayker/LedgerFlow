# LedgerFlow release
#
# Triggered by: git tag v1.4.0 && git push origin v1.4.0
#
# CRITICAL: RELEASE_KEYSTORE_BASE64 is the only thing that lets you ship an
# update to an already-installed app. If it is lost, every existing install is
# orphaned — users must uninstall (destroying local data) to move to a new key.
# Keep an offline copy outside GitHub. This is BUG3's root cause.

name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true

permissions:
  contents: write

env:
  JAVA_VERSION: '17'
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v6

      # ── Guards run again against the tagged commit, not just the PR ──
      - name: Re-run guards against tag
        run: |
          bash scripts/guard-schema.sh
          bash scripts/guard-version.sh

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is not set. Cannot produce a shippable build."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # Two Gradle runs, because AGP refuses to build an AAB while ABI splits
      # are on ("Please disable building multiple APKs when building an
      # Android app bundle", issuetracker 402800800 -- hit 2026-10-02).
      #
      # Play: playSafe's AAB (Play builds per-device APKs from it) and its
      # universal APK, no splits.
      #
      # BUG46: until 2026-10-02 nothing read keystore.properties, so release
      # was -unsigned. verifyReleaseSigning<Variant> checks every APK and the
      # playSafe AAB and rejects the debug key. ci.yml dry-runs these task
      # names on every PR, so they cannot rot.
      - name: Build and verify Play artifacts (playSafe)
        run: |
          ./gradlew \
            bundlePlaySafeRelease \
            assemblePlaySafeRelease \
            :app:verifyReleaseSigningPlaySafeRelease \
            -Pledgerflow.requireReleaseSigning \
            --stacktrace

      # Sideload and Galaxy Store: smsFull with -Pledgerflow.abiSplits, which
      # adds per-ABI APKs beside the universal one (owner, 2026-10-02). Galaxy
      # gets the arm64 split: the universal APK is ~197 MB, ~130 MB of it
      # x86/x86_64 code no Galaxy phone runs. GitHub keeps the universal APK.
      - name: Build and verify sideload and Galaxy artifacts (smsFull)
        run: |
          ./gradlew \
            assembleSmsFullRelease \
            :app:verifyReleaseSigningSmsFullRelease \
            -Pledgerflow.requireReleaseSigning \
            -Pledgerflow.abiSplits \
            --stacktrace

      # The Galaxy Store upload (docs/galaxy/README.md). Fails rather than
      # publishing a release without it, and holds it to the arm64 split's
      # SPEC §11 budget, the same 50 MiB CI's assemble job applies.
      - name: Galaxy Store APK (smsFull, arm64 split)
        run: |
          set -euo pipefail
          GALAXY=app/build/outputs/apk/smsFull/release/app-smsFull-arm64-v8a-release.apk
          test -f "$GALAXY" || { echo "::error::$GALAXY was not built. Did -Pledgerflow.abiSplits get dropped?"; exit 1; }
          SIZE=$(stat -c%s "$GALAXY")
          printf '%s -> %s KiB\n' "$GALAXY" "$((SIZE / 1024))"
          test "$SIZE" -le $((50 * 1024 * 1024)) || { echo "::error::$GALAXY exceeds the 50 MiB budget (SPEC §11)"; exit 1; }

      # ── The release build must survive the same durability gates ──
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      # The tagged commit's durability suite. It runs the DEBUG variant: library
      # modules build no release test variant, and the connected*Release tasks
      # this step used to name never existed (BUG46). Release CODE (R8) is
      # covered on the device by :benchmark's Bug38_OcrWorksInAShrunkBuildTest.
      - name: Durability suite (tagged commit, debug variant)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            ./gradlew :core:database:connectedSmsFullDebugAndroidTest --stacktrace
            ./gradlew :core:crypto:connectedSmsFullDebugAndroidTest   --stacktrace

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          find . -path '*/release/*.apk' -exec cp {} dist/ \;
          find . -path '*/release/*.aab' -exec cp {} dist/ \;
          # mapping.txt is MANDATORY — without it, R8-obfuscated crash reports
          # from the diagnostics screen (BUG7) are unreadable forever.
          # Named by VARIANT (.../mapping/<variant>/mapping.txt). This used the
          # module name, which is `app` for both flavours, so one flavour's
          # mapping overwrote the other's (BUG46).
          find . -name mapping.txt -path '*/mapping/*Release/*' | while read -r m; do
            VARIANT=$(basename "$(dirname "$m")")
            cp "$m" "dist/mapping-${VARIANT}-${GITHUB_REF_NAME}.txt"
          done
          test "$(ls dist/mapping-*.txt | wc -l)" -ge 2 || { echo "::error::expected a mapping file per flavour"; exit 1; }
          find . -name 'baseline-prof.txt' -exec cp {} dist/ \; || true
          ls -la dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true   # from Conventional Commits
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}

      # ── Runs even on failure. Signing material never persists. ──
      - name: Scrub signing material
        if: always()
        run: |
          rm -f keystore.properties "$RUNNER_TEMP/release.jks" || true
          echo "Signing material scrubbed."
