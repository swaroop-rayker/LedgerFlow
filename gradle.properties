# ── JVM, sized for the dev box, not for speed ─────────────────────────────
# The dev machine has 16 GB, of which the OS takes 6-8 and the desktop apps
# most of the rest. What a build may use is therefore bounded by the machine,
# and every number in this block is chosen to stay inside it -- a faster build
# that pages, heats the laptop to 66C and stalls every other app is slower in
# every way that matters.
#
# The history, so nobody re-derives it. An uncached `preMergeCheck` at the
# default worker count (one per logical CPU: 16 here) ran out of a 4g heap in
# D8 merging :feature:ocr's 203 MB debug test APK, and the same pressure
# surfaced as a lint FIR crash and a packaging failure. Raising the heap to 6g
# fixed that and made the daemon plus the Kotlin daemon hold ~5 GB between
# builds. The cause was concurrency, not heap: 16 workers each running D8, lint
# or a test JVM at once. So the fix is fewer workers and a smaller heap, measured.
#
# Metaspace is capped because KSP + Hilt on 26 modules otherwise grows it until
# the daemon swaps. **No -XX:+HeapDumpOnOutOfMemoryError**: on an OOM it writes
# the whole heap -- two ~5 GB .hprof files landed in the repo root this way --
# which is a multi-gigabyte disk burst at the worst possible moment, for a dump
# nobody on this project reads.
#
# CI is unaffected: ci.yml and release.yml pass their own
# GRADLE_OPTS=-Dorg.gradle.jvmargs=..., which take precedence over this file,
# and its runners have 4 cores, so the worker cap below is a no-op there.
# 3g, measured against 4g on the same uncached gate: Java peak 7.4 -> 5.9 GB,
# the Gradle daemon 6.4 -> 5.3 GB, no OutOfMemoryError, for +1.7 min wall time
# (9.3 -> 11.0). RAM is the scarce resource on this machine, not minutes.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Kotlin compiles inside the Gradle daemon rather than in its own daemon JVM.
# The separate daemon is a second heap that fills and is never handed back
# mid-build; measured at ~2.6 GB uncapped, and still ~1.5 GB capped. In-process
# shares the one heap bounded above.
kotlin.compiler.execution.strategy=in-process

# Three workers rather than sixteen. The measured cost is wall-clock time; the
# benefit is peak memory, disk bursts and heat, which on this machine were
# making the IDE, Claude Code and every other app hang during a build.
org.gradle.workers.max=3

# Release the daemon's heap after 15 idle minutes rather than the default 3
# hours, so a finished build stops holding gigabytes the desktop needs.
org.gradle.daemon.idletimeout=900000

# ── Build performance ─────────────────────────────────────────────────────
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=fail

# ── Android ───────────────────────────────────────────────────────────────
android.useAndroidX=true
android.nonTransitiveRClass=true
# NOTE: android.defaults.buildfeatures.buildconfig was removed in AGP 9.0 and
# its default is already false, so it is deliberately absent here. BuildConfig
# is opt-in per module via buildFeatures { buildConfig = true }.

# ── Kotlin ────────────────────────────────────────────────────────────────
kotlin.code.style=official

# ── Instrumented tests must not uninstall the app ─────────────────────────
# `connectedAndroidTest` uninstalls both APKs when it finishes, and an
# uninstall takes the app's data with it. That is the same destruction
# CLAUDE.md §4 forbids doing by hand ("Never adb uninstall during
# development -- it destroys test data and masks BUG1"), arriving through
# the back door of the test task.
#
# It cost a real vault twice during S8: the review install kept reappearing
# at onboarding after a test run, which read as a bug in the app and was
# not. Leaving the APKs installed also means the dev loop keeps exercising
# install-over-install, which is exactly what BUG1's countermeasure needs.
android.injected.androidTest.leaveApksInstalledAfterRun=true
