# ── JVM ───────────────────────────────────────────────────────────────────
# 6g, raised from the kickoff's 4g after S13 added OpenCV. An uncached
# `preMergeCheck --rerun-tasks --no-build-cache` at the default worker count
# ran out of heap in D8 merging :feature:ocr's debug test APK -- 203 MB, since
# a debug test APK carries OpenCV's and ML Kit's native libraries for every
# ABI -- and the same pressure surfaced as a lint FIR crash and a packaging
# failure in other runs, each passing when run alone. Not fixed by trimming
# ABIs from test APKs: the device suites should exercise the native libraries
# release ships. CI is unaffected: ci.yml and release.yml pass their own
# GRADLE_OPTS, which take precedence over this file.
#
# Metaspace is capped explicitly because KSP + Hilt annotation processing on a
# 26-module build will otherwise grow it until the daemon is swapping.
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# ── Build performance ─────────────────────────────────────────────────────
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=fail

# ── Android ───────────────────────────────────────────────────────────────
android.useAndroidX=true
android.nonTransitiveRClass=true
# NOTE: android.defaults.buildfeatures.buildconfig was removed in AGP 9.0 and
# its default is already false, so it is deliberately absent here. BuildConfig
# is opt-in per module via buildFeatures { buildConfig = true }.

# ── Kotlin ────────────────────────────────────────────────────────────────
kotlin.code.style=official

# ── Instrumented tests must not uninstall the app ─────────────────────────
# `connectedAndroidTest` uninstalls both APKs when it finishes, and an
# uninstall takes the app's data with it. That is the same destruction
# CLAUDE.md §4 forbids doing by hand ("Never adb uninstall during
# development -- it destroys test data and masks BUG1"), arriving through
# the back door of the test task.
#
# It cost a real vault twice during S8: the review install kept reappearing
# at onboarding after a test run, which read as a bug in the app and was
# not. Leaving the APKs installed also means the dev loop keeps exercising
# install-over-install, which is exactly what BUG1's countermeasure needs.
android.injected.androidTest.leaveApksInstalledAfterRun=true
