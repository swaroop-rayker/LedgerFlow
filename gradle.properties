# ── JVM ───────────────────────────────────────────────────────────────────
# 4g per SPEC/kickoff. Metaspace is capped explicitly because KSP + Hilt
# annotation processing on a 26-module build will otherwise grow it until the
# daemon is swapping.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# ── Build performance ─────────────────────────────────────────────────────
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=fail

# ── Android ───────────────────────────────────────────────────────────────
android.useAndroidX=true
android.nonTransitiveRClass=true
# NOTE: android.defaults.buildfeatures.buildconfig was removed in AGP 9.0 and
# its default is already false, so it is deliberately absent here. BuildConfig
# is opt-in per module via buildFeatures { buildConfig = true }.

# ── Kotlin ────────────────────────────────────────────────────────────────
kotlin.code.style=official
