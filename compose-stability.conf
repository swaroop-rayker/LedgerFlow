// Compose stability configuration (CLAUDE.md §8), read by the compose
// convention plugin for every Compose module.
//
// These types live in :core:model / :core:domain, which are plain Kotlin and
// not compiled by the Compose compiler, so the compiler cannot see that they
// are immutable and reports them unstable. As a LazyColumn item's parameter
// that is a regression: strong skipping then compares by identity, and a
// Paging refresh that hands back equal-but-new instances recomposes every
// visible row. Measured 2026-09-29 on the Ledger scroll.
//
// **Only list a type after checking it is deeply immutable**: a data class of
// `val`s whose types are themselves immutable (String, primitives, enums,
// Money, other entries here). Declaring a mutable type stable makes Compose
// skip a row that should have changed, which is a correctness bug, not a
// performance one. PendingTransaction is deliberately absent: it nests
// ExtractedTransaction and ReviewEdits, which have not been checked.

com.ledgerflow.core.model.Money
com.ledgerflow.core.model.LedgerListItem
com.ledgerflow.core.model.DeletedEntry
com.ledgerflow.core.domain.ledger.DraftSummary
