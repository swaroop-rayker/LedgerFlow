# Monotonic versionCode. Auto-incremented by the `incrementVersionCode` Gradle
# task and committed. NEVER decrease or reuse a value: Android refuses to
# install an APK whose versionCode is <= the installed one without an
# uninstall, and an uninstall destroys local data (BUG1 + BUG3 compounding).
#
# scripts/guard-version.sh compares this against the last v*.*.* release tag.
versionCode=1
versionName=0.1.0
